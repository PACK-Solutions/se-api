style:
    WildcardImport:
        active: false
    MaxLineLength:
        active: true
        maxLineLength: 160

ktlint:
    NoWildcardImports:
        active: false
    MaximumLineLength:
        active: true
        maxLineLength: 160
    ParameterListWrapping:
        active: false
    ClassSignature:
        active: false
    BlankLineBetweenWhenConditions:
        active: false
    FunctionSignature:
        active: true
        maxLineLength: 160
        forceMultilineWhenParameterCountGreaterOrEqualThan: 999
    ArgumentListWrapping:
        active: true
        maxLineLength: 160
    BinaryExpressionWrapping:
        maxLineLength: 160

complexity:
    LongParameterList:
        active: true
        allowedFunctionParameters: 10
        allowedConstructorParameters: 10
        ignoreDefaultParameters: true
        ignoreAnnotatedParameter:
            - Factory

exceptions:
    TooGenericExceptionThrown:
        active: false
    TooGenericExceptionCaught:
        active: false
